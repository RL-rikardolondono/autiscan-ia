*{box-sizing:border-box}
html,body{margin:0;background:var(--fondo);color:var(--tx);font-family:"Public Sans",system-ui,sans-serif;font-size:16px;line-height:1.45;color-scheme:light}

a{color:var(--azul2)}
input,select,textarea{font:inherit;color:var(--tx);background:#fff;border:1px solid var(--borde);border-radius:10px;padding:10px 12px;width:100%;color-scheme:light}

textarea{min-height:80px}
label{display:block;font-weight:600;font-size:.92rem;margin:10px 0 4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:11px 18px;font:600 1rem "Public Sans",sans-serif;cursor:pointer;background:var(--vz);color:#fff;text-decoration:none}

.btn.az{background:var(--azul)}.btn.az:hover{background:var(--azul2)}
.btn.sec{background:#fff;color:var(--azul);border:1px solid var(--borde)}.btn.sec:hover{background:var(--sa)}
.btn.wa{background:var(--wa)}
.btn.peq{padding:7px 12px;font-size:.9rem}
.btn.grande{padding:15px 24px;font-size:1.1rem}

.top{position:sticky;top:0;z-index:20;background:#fff;box-shadow:0 2px 10px rgba(11,79,138,.09);display:flex;align-items:center;gap:12px;padding:10px 18px}

.marca svg{width:38px;height:38px}
.marca .t1{font:700 1.25rem/1 "Barlow Condensed",sans-serif;color:var(--azul)}
.marca .t2{font:600 .72rem/1 "Public Sans",sans-serif;color:var(--txs)}
.top .esp{flex:1}
.top .usr{font-size:.85rem;color:var(--txs);text-align:right}
.hamb{display:none;background:none;border:1px solid var(--borde);border-radius:8px;font-size:1.3rem;padding:4px 10px;cursor:pointer}

.menu{width:230px;flex:none;background:#fff;border-right:1px solid var(--borde);padding:14px 10px}

.menu button.act{background:var(--sv);color:var(--vzo);font-weight:700}

.menu .sep{height:1px;background:var(--borde);margin:10px 6px}
.main{flex:1;padding:22px;max-width:1150px;width:100%;margin:0 auto}
.card{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:18px;margin-bottom:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.kpi{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:16px;cursor:pointer}
.kpi b{display:block;font:700 2.1rem/1 "Barlow Condensed",sans-serif;color:var(--azul)}
.kpi span{color:var(--txs);font-size:.9rem}
.fila{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fila.ent{justify-content:space-between}
.muted{color:var(--txs);font-size:.9rem}
.nota{background:var(--sa);border-radius:10px;padding:10px 14px;font-size:.92rem;color:var(--tx)}
.nota.v{background:var(--sv)}
.chip{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.8rem;font-weight:700;background:var(--sa);color:var(--azul)}
.chip.v{background:var(--sv);color:var(--vzo)}.chip.a{background:var(--amb2);color:var(--amb)}.chip.r{background:var(--rojo2);color:var(--rojo)}.chip.n{background:var(--nar2);color:var(--nar)}
table{width:100%;border-collapse:collapse;font-size:.93rem}

tr.clic{cursor:pointer}tr.clic:hover td{background:var(--sa)}
.tabla{overflow-x:auto}
.barra{height:10px;background:var(--sa);border-radius:6px;overflow:hidden;min-width:80px}

.item{border:1px solid var(--borde);border-radius:12px;padding:12px 14px;margin:8px 0;background:#fff}

.opc{display:flex;gap:8px;flex-wrap:wrap}

.modal{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:22px}
.res{border-radius:14px;padding:18px;margin-bottom:16px}

.res.moderado{background:var(--amb2);border:1px solid #F1D29A}
.res.alto{background:var(--nar2);border:1px solid #F5BFA0}
.res h3{margin:0}
.ingreso{max-width:1050px;margin:0 auto;padding:26px 16px;display:grid;grid-template-columns:1.1fr .9fr;gap:26px;align-items:start}
.promesa h1{font-size:2.6rem;line-height:1.05}
.promesa li{margin:6px 0}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;border:1px solid var(--borde);background:#fff;padding:10px;border-radius:10px;font:600 .95rem "Public Sans",sans-serif;cursor:pointer;color:var(--tx)}
.tabs button.act{background:var(--vz);color:#fff;border-color:var(--vz)}
.ojo{position:relative}.ojo button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:var(--sa);border-radius:7px;padding:5px 9px;font-size:.8rem;cursor:pointer;color:var(--azul)}
.escudo{display:flex;gap:10px;align-items:flex-start;background:var(--sv);border-radius:12px;padding:12px 14px;font-size:.9rem}
.pie{font-size:.8rem;color:var(--txs);border-top:1px solid var(--borde);margin-top:18px;padding-top:10px}
.informe{max-width:900px}
.check{display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-weight:400}
.vacio{text-align:center;padding:30px;color:var(--txs)}
.paso{display:flex;gap:12px;align-items:flex-start;margin:10px 0}
.paso b.n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--vz);color:#fff;display:flex;align-items:center;justify-content:center}
@media(max-width:860px){
 .hamb{display:block}
 .menu{position:fixed;top:58px;left:0;bottom:0;z-index:30;transform:translateX(-105%);transition:transform .2s;box-shadow:4px 0 20px rgba(0,0,0,.15);overflow:auto}
 .menu.abierto{transform:none}
 .main{padding:14px}
 .g2,.g3,.g4{grid-template-columns:1fr 1fr}

 .top .usr{display:none}
 .toast{bottom:14px}
}
@media(max-width:520px){.g2,.g3{grid-template-columns:1fr}.opc button{min-width:80px;font-size:.85rem}}
@media(max-width:520px){.demo{padding:6px 12px;gap:6px}.demo span{display:none}.demo .btn{font-size:.82rem}.top{padding:8px 12px}.marca .t2{display:none}}

.foto{width:100%;object-fit:cover;border-radius:14px;display:block;margin-bottom:14px}
.herr{border:1px solid var(--borde);border-radius:10px;padding:10px 12px;margin-top:8px;background:#fff}
.herr.sel{border-color:#14A38B;background:#E3F6F2}
.herrs h3{margin-top:0}
#sync{position:fixed;right:14px;top:74px;background:#E8F1FA;color:var(--azul);border:1px solid var(--borde);font-weight:600;font-size:13px;padding:6px 12px;border-radius:20px;z-index:90;box-shadow:0 2px 8px rgba(0,0,0,.08)}
#sync.mal{background:#FDECEA;color:#B42318;border-color:#F5C2BD}
.btn.rojo{background:#B42318;border-color:#B42318;color:#fff}
.toast.arriba{top:24px;bottom:auto}

<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js" defer></script><script>/* AutiScan-IA — Instrumento propio de Ricardo Londoño González (Clínica Reina Elizabeth IPS)

 {n:"Comunicación verbal", subs:[

  rec:{low:["Fomentar conversaciones sobre temas de interés específico de la persona","Practicar habilidades pragmáticas en contextos naturales y estructurados","Proporcionar tiempo adicional para procesar información verbal y formular respuestas","Utilizar preguntas abiertas y cerradas de forma estratégica según capacidades","Modelar formas efectivas de iniciar, mantener y terminar conversaciones","Crear oportunidades de comunicación funcional en actividades cotidianas"],

 {n:"Comunicación no verbal", subs:[

  rec:{low:["Practicar reconocimiento de expresiones faciales básicas con apoyos visuales","Fomentar el uso de gestos naturales durante la comunicación cotidiana","Modelar contacto visual apropiado durante interacciones (respetando preferencias)","Utilizar juegos que impliquen compartir atención sobre un objeto o actividad","Implementar actividades de imitación recíproca gradualmente más complejas","Crear entornos comunicativos donde los gestos tengan funcionalidad práctica"],

 {n:"Socialización", subs:[

  rec:{low:["Fomentar interacciones en grupos pequeños con intereses compartidos","Practicar habilidades sociales en entornos estructurados y predecibles","Crear oportunidades de socialización predecibles, positivas y de corta duración","Reforzar positivamente las interacciones sociales exitosas","Establecer una red de contactos sociales de confianza","Proporcionar tiempo y espacio para recargar energía después de la socialización"],

 {n:"Conductas restringidas", subs:[
  ["A. Intereses restringidos",["¿Tiene intereses inusualmente intensos o específicos?","¿Sus intereses son inusuales en contenido o son excesivamente limitados?","¿Tiene dificultad para cambiar de interés o de actividad?"]],
  ["B. Comportamientos repetitivos",["¿Realiza movimientos repetitivos como aleteo, balanceo o girar?","¿Alinea objetos o los organiza de manera ritualizada?","¿Repite palabras, frases o acciones específicas?"]],

  rec:{low:["Respetar intereses específicos y utilizarlos como motivadores para nuevos aprendizajes","Ampliar gradualmente el rango de actividades e intereses relacionados","Establecer momentos específicos para actividades preferidas en el horario diario","Fomentar la socialización a través de intereses específicos compartidos","Valorar el conocimiento especializado como una fortaleza","Proporcionar materiales variados dentro del tema de interés"],

 if(h<=lim){const dias=difDias(h,lim)+1;return{k:"aviso",t:"Aviso: "+dias+(dias==1?" día":" días"),dias,lim,chip:"r"}}

function radar(r){const n=r.dom.length,cx=170,cy=165,R=120;const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+Math.cos(a)*R*v,cy+Math.sin(a)*R*v]};
 let s=`<svg viewBox="0 0 340 330" style="width:100%;max-width:420px" role="img" aria-label="Gráfico de dominios">`;
 [.25,.5,.75,1].forEach(k=>{s+=`<polygon points="${r.dom.map((_,i)=>pt(i,k).join(",")).join(" ")}" fill="none" stroke="#DCE5EE"/>`});
 r.dom.forEach((d,i)=>{const [x,y]=pt(i,1);s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#DCE5EE"/>`;const [lx,ly]=pt(i,1.16);s+=`<text x="${lx}" y="${ly}" font-size="10" text-anchor="middle" dominant-baseline="middle" fill="#5D6B78">${d.d}</text>`});
 s+=`<polygon points="${r.dom.map((d,i)=>pt(i,d.pct/100).join(",")).join(" ")}" fill="rgba(20,163,139,.25)" stroke="#14A38B" stroke-width="2"/>`;
 r.dom.forEach((d,i)=>{const [x,y]=pt(i,d.pct/100);s+=`<circle cx="${x}" cy="${y}" r="3.5" fill="${NIV[d.nivel][2]}"/>`});
 return s+"</svg>"}

function comparacion(evs){const comp=evs.filter(e=>e.estado=="completa");const ult={};comp.forEach(e=>{if(!ult[e.inf])ult[e.inf]=e});const ks=Object.keys(ult);
 const prof=comp.filter(e=>e.inf=="prof").slice().reverse();let h="";

async function api(m,p,b,intento){
 let r;try{const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),30000);
  r=await fetch(API+p,{method:m,headers:{"content-type":"application/json",...(TOK?{authorization:"Bearer "+TOK}:{})},body:b?JSON.stringify(b):undefined,signal:ctl.signal});clearTimeout(t)}
 catch(e){if((intento||0)<3){if(!intento)toast("Estamos preparando su espacio seguro… un momento.");await new Promise(z=>setTimeout(z,5000));return api(m,p,b,(intento||0)+1)}throw Object.assign(new Error("No hay conexión con el servidor. Revise su internet e intente de nuevo."),{status:0})}
 let j={};try{j=await r.json()}catch(e){}
 if(r.status===401&&TOK&&!/\/api\/(entrar|cambiar-clave|eliminar-cuenta)/.test(p)){finSesion("Su sesión terminó. Ingrese de nuevo.")}
 if(!r.ok)throw Object.assign(new Error(j.error||"No se pudo completar. Intente de nuevo."),{status:r.status,j});
 return j}

let COLA_T=null,ENVIANDO=false,REINTENTO=0;
function indicador(t,mal){let el=$("#sync");if(!t){el&&el.remove();return}if(!el){el=document.createElement("div");el.id="sync";document.body.appendChild(el)}el.textContent=t;el.className=mal?"mal":""}

async function enviarCambios(){
 if(ENVIANDO){encolar();return}if(!D||!S.ses||S.local||S.ses.rol=="super")return;ENVIANDO=true;indicador("Guardando…");
 try{
  for(const p of D.pacientes){const f=foto_("p",p);if(SNAP.get("p:"+p.id)===f)continue;
   const r=await api("PUT","/api/pacientes/"+p.id,{datos:{...Object.fromEntries(CAMPOS_P.map(k=>[k,p[k]])),consent:!!p.consent},v:p.v});
   Object.assign(p,r.datos);SNAP.set("p:"+p.id,foto_("p",p))}
  for(const e of D.evals){if(e.estado=="pendiente"&&e.v)continue;const f=foto_("e",e);if(SNAP.get("e:"+e.id)===f)continue;
   const r=await api("PUT","/api/evals/"+e.id,{datos:{inf:e.inf,pacienteId:e.pacienteId,resp:e.resp,pag:e.pag,obs:e.obs,estado:e.estado,motivoAnula:e.motivoAnula},v:e.v});
   const vista=e.estado;Object.assign(e,r.datos);if(vista=="completa"&&e.estado!="completa")toast("No se pudo terminar: revise que estén todas las respuestas.");SNAP.set("e:"+e.id,foto_("e",e))}
  REINTENTO=0;indicador(null)}
 catch(err){
  if(err.status===0){REINTENTO++;indicador("Sin conexión: sus cambios se guardan apenas vuelva internet",true);ENVIANDO=false;setTimeout(enviarCambios,Math.min(30000,4000*REINTENTO));return}
  indicador(null);toast(err.message);await recargar()}
 finally{ENVIANDO=false}}

async function arrancarSrv(){
 const h=location.hash||"",qs=new URLSearchParams(location.search),refBold=qs.get("bold-order-id");
 // Pantalla de espera de SkyNet Genesis mientras el servidor despierta (máximo una vez cada 10 minutos)
 const necesita=TOK||h.startsWith("#r-")||h.startsWith("#clave=")||refBold;
 if(necesita){let vivo=false;try{const c=new AbortController(),t=setTimeout(()=>c.abort(),3500);vivo=(await fetch(API+"/health",{signal:c.signal})).ok;clearTimeout(t)}catch(e){}
  let ult=0;try{ult=+sessionStorage.getItem("as:espera")||0}catch(e){}
  if(!vivo&&Date.now()-ult>600000){try{sessionStorage.setItem("as:espera",Date.now())}catch(e){}location.replace("https://skynetgenesis.com/abrir.html?app=autiscan-ia"+(location.search?"&"+location.search.slice(1):"")+h);return}}
